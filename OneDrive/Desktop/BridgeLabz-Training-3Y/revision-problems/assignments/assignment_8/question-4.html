<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>CSS Selectors Practice</h1>
    </header>

    <main>
      ```
      <section>
        <p>This is an element selector.</p>

        <p class="special">This is a class selector.</p>

        <p id="unique">This is an ID selector.</p>

        <a href="https://example.com">Attribute selector link</a>

        <div class="parent">
          <p>Descendant paragraph</p>

          <div>
            <p>Nested paragraph</p>
          </div>
        </div>

        <ul>
          <li>First Item</li>
          <li>Second Item</li>
          <li>Third Item</li>
        </ul>

        <p class="after">Paragraph after the list.</p>
      </section>
      ```
    </main>

    <footer>
      <p>CSS Selectors Practice</p>
    </footer>
  </body>
</html>
