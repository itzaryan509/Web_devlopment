<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    ```
    <title>Tooltip Demonstration</title>

    <!-- Connecting CSS file -->
    <link rel="stylesheet" href="style.css" />
    ```
  </head>

  <body>
    ```
    <header>
      <h1>CSS Tooltip Demonstration</h1>
      <p>Move your mouse over the elements to see the tooltips.</p>
    </header>

    <main>
      <section class="tooltip-container">
        <!-- Tooltip 1 -->
        <div class="tooltip">
          <button>Home</button>
          <span class="tooltip-text">Go to Home</span>
        </div>

        <!-- Tooltip 2 -->
        <div class="tooltip">
          <button>Profile</button>
          <span class="tooltip-text">View your Profile</span>
        </div>

        <!-- Tooltip 3 -->
        <div class="tooltip">
          <button>Settings</button>
          <span class="tooltip-text">Open Settings</span>
        </div>

        <!-- Tooltip 4 -->
        <div class="tooltip">
          <button>Help</button>
          <span class="tooltip-text">Get Help</span>
        </div>
      </section>
    </main>

    <footer>
      <p>CSS Practice - Tooltip Demonstration</p>
    </footer>
    ```
  </body>
</html>
