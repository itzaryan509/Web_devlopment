<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Image Showcase</h1>
    </header>

    <main>
      <section class="gallery">
        ```
        <figure>
          <div class="image-box">
            <img src="https://picsum.photos/id/1015/500/300" alt="Mountain" />
          </div>
          <figcaption>Beautiful Mountain</figcaption>
        </figure>

        <figure>
          <div class="image-box">
            <img src="https://picsum.photos/id/1016/500/300" alt="Nature" />
          </div>
          <figcaption>Nature View</figcaption>
        </figure>

        <figure>
          <div class="image-box">
            <img src="https://picsum.photos/id/1025/500/300" alt="Dog" />
          </div>
          <figcaption>Cute Dog</figcaption>
        </figure>

        <figure>
          <div class="image-box">
            <img src="https://picsum.photos/id/1035/500/300" alt="River" />
          </div>
          <figcaption>River View</figcaption>
        </figure>

        <figure>
          <div class="image-box">
            <img src="https://picsum.photos/id/1043/500/300" alt="Forest" />
          </div>
          <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
          <div class="image-box">
            <img src="https://picsum.photos/id/1050/500/300" alt="Animal" />
          </div>
          <figcaption>Wild Animal</figcaption>
        </figure>
      </section>
      ```
    </main>

    <footer>
      <p>Image Showcase Practice</p>
    </footer>
  </body>
</html>
