<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>My Mini Website</h1>
    </header>

    <main>
      ```
      <section class="card">
        <img src="https://picsum.photos/300/180" alt="Sample Image" />

        <div class="content">
          <h2>Welcome User</h2>

          <p>
            This is a simple responsive user interface created using HTML and
            CSS.
          </p>

          <form>
            <input type="text" placeholder="Enter your name" />

            <input type="email" placeholder="Enter your email" />

            <div class="buttons">
              <button type="submit">Submit</button>
              <button type="reset">Reset</button>
            </div>
          </form>
        </div>
      </section>
      ```
    </main>

    <footer>
      <p>&copy; 2026 Mini UI Practice</p>
    </footer>
  </body>
</html>
