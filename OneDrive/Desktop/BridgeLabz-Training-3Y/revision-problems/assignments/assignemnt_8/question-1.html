<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pseudo Classes</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>CSS Pseudo-Classes</h1>
    </header>

    <main>
      <section class="examples">
        <div class="example">
          <h2>:hover</h2>
          <a href="#">Hover Me</a>
          <p>Changes when mouse is placed over the element.</p>
        </div>

        <div class="example">
          <h2>:focus</h2>
          <input type="text" placeholder="Click here" />
          <p>Applies when an input gets focus.</p>
        </div>

        <div class="example">
          <h2>:active</h2>
          <button>Click Me</button>
          <p>Applies while the button is being clicked.</p>
        </div>

        <div class="example">
          <h2>:nth-child()</h2>

          <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
          </ul>

          <p>Styles a specific child element.</p>
        </div>
      </section>
    </main>

    <footer>
      <p>CSS Practice - Pseudo Classes</p>
    </footer>
  </body>
</html>
